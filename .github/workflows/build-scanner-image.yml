name: Build scanner images

# Rebuilds the prebaked scanner images (presidio stack, cppcheck) and pushes
# them to GHCR. Rebuild on dependency bump: edit the image tag in
# src/checks/main.py (PRESIDIO_IMAGE / CPPCHECK_IMAGE) and this workflow,
# then bump the module version.
# amd64 native on the ARC runner (dind) — matches the nodes that pull it.

on:
  workflow_dispatch:
  push:
    paths: ['tools/pii-scanner/**', 'tools/cppcheck-scanner/**']

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: k8s-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push scanner image
        env:
          IMAGE: ghcr.io/snoby-demo-org/pii-scanner:presidio-2.2.35
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" tools/pii-scanner
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io

  build-push-cppcheck:
    runs-on: k8s-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create buildx builder (LAN registry trust)
        run: |
          printf '[registry."registry.viporlab.net"]\n  http = false\n  insecure = true\n' > buildkitd.toml
          docker buildx create --name cppcheck-release --driver docker-container --config buildkitd.toml --use
          docker buildx inspect cppcheck-release --bootstrap

      - name: Build and push cppcheck scanner image
        env:
          IMAGE: registry.viporlab.net/demo/cppcheck-scanner:cppcheck-2.17.1
        run: |
          docker buildx build --platform linux/amd64 --push -t "$IMAGE" tools/cppcheck-scanner
          curl -sk "https://registry.viporlab.net/v2/demo/cppcheck-scanner/manifests/cppcheck-2.17.1" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" -o /dev/null -w "verify=%{http_code}\n"
